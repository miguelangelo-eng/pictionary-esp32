## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  espressif/esp-tflite-micro: '*'

  # Só para a tela touch (CONFIG_PICTIONARY_TELA). Desligada, nada disso é baixado.
  lvgl/lvgl:
    version: '~9.3.0'
    rules:
      - if: '$CONFIG{PICTIONARY_TELA} == True'
  espressif/esp_lvgl_port:
    version: '^2.4.3'
    rules:
      - if: '$CONFIG{PICTIONARY_TELA} == True'
  espressif/esp_lcd_ili9341:
    version: '^2.0.0'
    rules:
      - if: '$CONFIG{PICTIONARY_TELA} == True'
  atanisoft/esp_lcd_touch_xpt2046:
    version: '^1.0.5'
    rules:
      - if: '$CONFIG{PICTIONARY_TELA} == True'
